<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecodeLabs - Project 3</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="theme-container">
        <button class="btn js-theme-btn">🌙 Dark Mode</button>
    </div>

    <div class="dashboard">
        <h1>Frontend Project 3: Interactive Elements</h1>
        <p class="subtitle">Client-Side Nervous System (DOM Manipulation)</p>

        <div class="card">
            <h3>1. Dynamic Greeting</h3>
            <input type="text" class="js-name-input" placeholder="Enter your name here...">
            <h4 class="js-greeting-output">Hello, Guest! Welcome to DecodeLabs.</h4>
        </div>

        <div class="card">
            <h3>2. Live Interactive Counter</h3>
            <div class="counter-box">
                <button class="btn-counter js-minus-btn">-</button>
                <span class="counter-value js-counter-value">0</span>
                <button class="btn-counter js-plus-btn">+</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
